<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Shubh Deepawali — Ramayana inspired greeting</title>
<desc id="desc">Golden diyas illuminate a stylized Ayodhya skyline beneath a starry midnight blue sky.</desc>
<defs>
